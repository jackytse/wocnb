<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=public-sans:400,500,600,700" rel="stylesheet" />
  <title>WOCNB</title>
  <meta name="description" content="WOCNB —— CNB.cool 的桌面客户端，在桌面端浏览与管理组织、仓库、Issue、合并请求与构建流水线。WOCNB is a desktop client for CNB.cool.">
  <meta property="og:title" content="WOCNB">
  <meta property="og:description" content="CNB.cool 的桌面客户端：在桌面端浏览与管理组织、仓库、Issue、合并请求与构建流水线。A desktop client for CNB.cool.">
  <meta name="twitter:card" content="summary">
  <style>html { background-color: #ffffff } html.dark { background-color: #18181b }</style>
  <script>
    (function () {
      var mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
      var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) {
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18181b')
      }
    })()
  </script>
</head>

<body>
  <div id="app" class="isolate"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
