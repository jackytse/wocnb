                Write-Output "[wocnb-ci] 从兜底路径启用 cargo: $d"
                break
              }
            }
            # 真实 toolchain 优先（与 install 阶段同一修复，rc.32 实测）：
            # cargo/rustc 是 rustup 的 shim，RUSTUP_HOME 里没有默认 toolchain 时
            # 会报 "no default is configured"。本阶段是独立脚本进程，install 阶段
            # 对 PATH 的修改不会带过来，必须在这里再找一次真实 toolchain bin
            # （<rustup-home>\toolchains\*\bin\cargo.exe）并前置到 PATH。
            # ⚠️ 这段与 install 阶段的同名逻辑必须同步修改（无共享脚本可复用）。
            $rustupHomes = @($env:RUSTUP_HOME, "$env:USERPROFILE\.rustup", 'C:\rustup')
            $rustupHomes += @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName '.rustup' })
            $activeToolchain = $null
            foreach ($rh in $rustupHomes) {
              if (-not $rh -or -not (Test-Path (Join-Path $rh 'toolchains'))) { continue }
              foreach ($tc in @(Get-ChildItem (Join-Path $rh 'toolchains') -Directory -ErrorAction SilentlyContinue)) {
                $tcBin = Join-Path $tc.FullName 'bin'
                if (Test-Path (Join-Path $tcBin 'cargo.exe')) { $activeToolchain = $tcBin; break }
              }
              if ($activeToolchain) {
                if (-not $env:RUSTUP_HOME) { $env:RUSTUP_HOME = $rh }
                break
              }
            }
            if ($activeToolchain) {
              if ($env:PATH -notlike "*$activeToolchain*") { $env:PATH = "$activeToolchain;$env:PATH" }
              Write-Output "[wocnb-ci] 启用真实 rust toolchain: $activeToolchain"
            }
            # node PATH 兜底（rc.28 实测）：本阶段是独立脚本进程，install 阶段
            # 对 PATH 的修改（含自动安装的 C:\ci-tools\node）不会带过来 ——
            # 节点环境漂移时 install 用了兜底 node，本阶段就再也找不到 npm/node，
            # 后续 `pnpm exec tauri` 全部失效。与 rust 兜底同一思路：先探测
            # Get-Command node，命中不了再扫常见安装位 + install 阶段的
            # 规范安装位置（C:\ci-tools\node\node-*，取版本号最新的一份）。
            # 注意：探测"命令不存在"必须用 Get-Command -ErrorAction
            # SilentlyContinue，不能用 cmd /c —— 这里是查存在性，不是验退出码。
            if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              function Find-NodeDirBuild {
                param([string[]]$Roots)
                foreach ($root in $Roots) {
                  if (-not $root) { continue }
                  if (Test-Path (Join-Path $root 'node.exe')) { return $root }
                  $vers = @(Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending)
                  foreach ($v in $vers) {
                    foreach ($cand in @($v.FullName, (Join-Path $v.FullName 'bin'))) {
                      if (Test-Path (Join-Path $cand 'node.exe')) { return $cand }
                    }
                  }
                }
                return $null
              }
              $buildNodeRoots = @(
                'C:\ci-tools\node',
                "$env:ProgramFiles\nodejs",
                "$env:LOCALAPPDATA\Programs\nodejs",
                'C:\nodejs'
              )
              foreach ($u in @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue)) {
                $buildNodeRoots += (Join-Path $u.FullName '.nvm\versions\node')
                $buildNodeRoots += (Join-Path $u.FullName 'AppData\Roaming\nvm')
                $buildNodeRoots += (Join-Path $u.FullName 'AppData\Local\Programs\nodejs')
              }
              $buildNodeDir = Find-NodeDirBuild -Roots $buildNodeRoots
              if ($buildNodeDir) {
                if ($env:PATH -notlike "*$buildNodeDir*") { $env:PATH = "$buildNodeDir;$env:PATH" }
                Write-Output "[wocnb-ci] 从兜底路径启用 node: $buildNodeDir"
              }
              else {
                Write-Output "[wocnb-ci] 错误：build-x64 找不到 node（install 阶段应已兜底安装），无法继续"
                exit 1
              }
            }
            # pnpm 兜底：npm 全局 bin（%APPDATA%\npm）可能不在服务账户 PATH
            # 里（rc.12 实测 install 阶段同坑）；pnpm exec tauri 依赖它。
            # npm 命令本身也可能不可见（rc.28 实测），直接调用会抛
            # CommandNotFoundException 终止性错误 —— 先探存在性再调用。
            if (Get-Command npm -ErrorAction SilentlyContinue) {
              $npmPrefix2 = & npm config get prefix
              if ($npmPrefix2 -and (Test-Path $npmPrefix2) -and ($env:PATH -notlike "*$npmPrefix2*")) {
                $env:PATH = "$npmPrefix2;$env:PATH"
              }
            }
            # pnpm 可用性实测（rc.27 教训）：本阶段是独立脚本进程，且 pnpm 命令
            # 不存在时 PS 的 CommandNotFoundException 是终止性错误 —— 直接调用
            # 就崩，兜底永远执行不到。必须 cmd /c 包一层探测，不可用再兜底。
            cmd /c "pnpm -v >nul 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Write-Output "[wocnb-ci] build-x64 pnpm 不可用，npm 全局安装 pnpm@12.14.0 兜底"
              npm i -g pnpm@12.14.0 --force
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              $npmPrefix3 = & npm config get prefix
              if ($npmPrefix3 -and (Test-Path $npmPrefix3) -and ($env:PATH -notlike "*$npmPrefix3*")) {
                $env:PATH = "$npmPrefix3;$env:PATH"
              }
            }
            # NSIS 工具链预置（rc.13 实测）：Rust 编译成功后，tauri bundler 打
            # NSIS 安装包时要从 GitHub 下载 nsis-3.13.zip + nsis_tauri_utils.dll，
            # 国内自托管节点直连 GitHub 超时（failed to bundle project:
            # `timeout: global`）。双保险：
            #   1) 设 bundler 镜像变量——其内置下载逻辑把 GitHub URL 拼到镜像
            #      后面（<mirror>/https://github.com/...，ghfast.top 即此格式）；
            #   2) 预置 bundler 缓存目录（多镜像 curl 轮询下载），第一次成功后
            #      后续构建直接复用，完全离线。
            # 版本对应（tauri-bundler 2.10.3/2.10.4 源码，与 cli 2.12.4 内嵌版
            # 本一致，且与 rc.13 日志中 nsis-3.13.zip 的 URL 吻合）：
            #   NSIS 3.13 + nsis_tauri_utils v0.5.3。dll 哈希不匹配时 bundler
            #   只会重下 dll（小文件，走镜像变量），不会清掉整个 NSIS 目录。
            $env:TAURI_BUNDLER_TOOLS_GITHUB_MIRROR = 'https://ghfast.top/'
            $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri'
            $nsisPath = Join-Path $toolsPath 'NSIS'
            $dllPath = Join-Path $nsisPath 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
            $dllSha1 = '75197FEE3C6A814FE035788D1C34EAD39349B860'   # 官方值（bundler 2.10.4 源码）
            # 判定「是否需要重建」：makensis 不存在 / dll 缺失 / dll 哈希不符。
            # rc.15 教训：只判存在性会让一次坏文件占位永久通过检查，预置逻辑
            # 被整段跳过（日志里没有任何 [wocnb-ci] 预置输出），必须按哈希校验。
            $needRebuild = $true
            if ((Test-Path (Join-Path $nsisPath 'makensis.exe')) -and (Test-Path $dllPath)) {
              $cur = (Get-FileHash $dllPath -Algorithm SHA1).Hash
              if ($cur -eq $dllSha1) { $needRebuild = $false }
              else { Write-Output "[wocnb-ci] dll SHA1 不符（$cur），重建 NSIS 缓存" }
            }
            if ($needRebuild) {
              New-Item -ItemType Directory -Force -Path $toolsPath | Out-Null
              $zip = Join-Path $env:TEMP 'nsis-3.13.zip'
              if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
                # NSIS 主体缺失：按「镜像 1 → 镜像 2 → 直连」顺序尝试下载 zip
                $nsisOk = $false
                foreach ($u in @(
                  'https://ghfast.top/https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip',
                  'https://gh-proxy.com/https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip',
                  'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip'
                )) {
                  Write-Output "[wocnb-ci] 下载 NSIS: $u"
                  curl.exe -sSL --retry 2 --connect-timeout 15 -o $zip $u
                  if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 1MB) { $nsisOk = $true; break }
                }
                if (-not $nsisOk) {
                  # 软失败：镜像变量已设，bundler 自己会走镜像下载，不阻断构建
                  Write-Output '[wocnb-ci] 警告: NSIS 预置下载失败，交由 bundler 走镜像下载'
                } else {
                  # zip 顶层目录是 nsis-3.13，解压后改名 NSIS（与 bundler 缓存结构一致）
                  if (Test-Path $nsisPath) { Remove-Item -Recurse -Force $nsisPath }
                  $extractDir = Join-Path $toolsPath 'nsis-3.13'
                  if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
                  Expand-Archive -Path $zip -DestinationPath $toolsPath -Force
                  Rename-Item $extractDir 'NSIS'
                  Remove-Item $zip -Force
                  Write-Output '[wocnb-ci] NSIS 3.13 预置完成'
                }
              }
              # dll 校验：SHA1 不符即重下（34KB，官方哈希见上）
              $dllOk = $false
              if (Test-Path $dllPath) {
                if ((Get-FileHash $dllPath -Algorithm SHA1).Hash -eq $dllSha1) { $dllOk = $true }
                else { Remove-Item -Force $dllPath }
              }
              if (-not $dllOk) {
                New-Item -ItemType Directory -Force -Path (Split-Path $dllPath) | Out-Null
                foreach ($u in @(
                  'https://ghfast.top/https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll',
                  'https://gh-proxy.com/https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll',
                  'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll'
                )) {
                  Write-Output "[wocnb-ci] 下载 nsis_tauri_utils.dll: $u"
                  curl.exe -sSL --retry 2 --connect-timeout 15 -o $dllPath $u
                  if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dllPath) -or (Get-Item $dllPath).Length -lt 10KB) { continue }
                  if ((Get-FileHash $dllPath -Algorithm SHA1).Hash -eq $dllSha1) { $dllOk = $true; break }
                  Write-Output '[wocnb-ci] dll SHA1 不匹配，换下一个下载源'
                }
                if (-not $dllOk) {
                  # 软失败：删掉残留坏文件，交给 bundler 走镜像变量自行下载
                  if (Test-Path $dllPath) { Remove-Item -Force $dllPath }
                  Write-Output '[wocnb-ci] 警告: dll 预置失败，交由 bundler 走镜像下载'
                }
              }
            }
            # 诊断（rc.15 报 makensis 启动失败 0x2 = 找不到文件，但目录检查通过）：
            # rc.16 定位到根目录那个 2560 字节的 makensis.exe 其实是「启动器桩」，
            # 内部字符串就是 "Unable to start child process, error %#x"，它负责
            # 转发到同目录 Bin\makensis.exe；转发失败说明 Bin 里的真编译器不可用
            # （自托管 SYSTEM 账户下常见于杀软隔离）。对策：直接把真编译器
            # 复制到根目录覆盖桩程序，绕开转发环节。
            $rootExe = Join-Path $nsisPath 'makensis.exe'
            $binExe = Join-Path $nsisPath 'Bin\makensis.exe'
            if ((Test-Path $binExe) -and (Get-Item $binExe).Length -gt 100KB) {
              if (-not (Test-Path $rootExe) -or (Get-Item $rootExe).Length -lt 100KB) {
                Copy-Item $binExe $rootExe -Force
                Write-Output '[wocnb-ci] 已用 Bin\makensis.exe 覆盖根目录启动器桩'
              }
              # 真编译器依赖 Bin 下的 zlib1.dll 等，必须一并放到根目录，
              # 否则直接执行会报 0xC0000135（STATUS_DLL_NOT_FOUND，rc.17 实测）
              Get-ChildItem (Join-Path $nsisPath 'Bin') -Filter *.dll -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName (Join-Path $nsisPath $_.Name) -Force }
              # 双保险：把 Bin 加进 PATH，让 DLL 加载器的 PATH 搜索也能兜住
              if ($env:PATH -notlike "*$nsisPath\Bin*") { $env:PATH = "$nsisPath\Bin;$env:PATH" }
            } else {
              Write-Output "[wocnb-ci] 警告: Bin\makensis.exe 缺失或过小（可能被杀软隔离），Bin 目录内容："
              if (Test-Path (Join-Path $nsisPath 'Bin')) {
                Get-ChildItem (Join-Path $nsisPath 'Bin') -Name | ForEach-Object { Write-Output "  $_" }
              }
            }
            Write-Output "[wocnb-ci] NSIS 路径: $nsisPath"
            # —— 64 位 makensis 装配（2026-11-19，Windows 热更新链路的解锁点）——
            #
            # 背景：tauri zip 的 makensis 是 32 位（Bin\makensis.exe + 根目录
            # 2560 字节启动器桩），而 Windows Server 容器禁用 WoW64，32 位进程
            # 一律 0xC0000135（rc.17~rc.19 三轮实测，依赖补齐也无效）→ rc 阶段
            # 只能 --no-bundle 出裸 exe → 无签名产物 → Windows 进不了 updater
            # 清单（热更新长期缺席，rc.36~rc.38 的 latest.json 只有 darwin 条目）。
            #
            # 解法：MSYS2 的 mingw-w64-x86_64-nsis 3.13 包 —— 与 tauri zip **同
            # 版本** 3.13；纯静态链接、零运行时依赖（官方包信息确认）；x64
            # host 进程在容器里正常跑。只替换编译器二进制，Stubs/Include/
            # Plugins 资源全部保留 tauri zip 的 3.13 原版（版本严格一致）。
            #
            # 为什么替换是安全的：tauri bundler（cli 2.12.4 内嵌）对 NSIS 缓存
            # 目录只校验 NSIS.exe 与 nsis_tauri_utils.dll 的哈希，**不校验
            # makensis.exe**；且调用路径就是 <NSIS 目录>\makensis.exe（源码
            # L706），与我们的落点吻合。Stubs/Include 在编译器同目录，资源
            # 加载无需任何额外参数。
            #
            # 下载源三选一（TUNA / 中科大 / 官方，均为 msys2 仓库直链）；包
            # 落盘持久缓存（解包好的 mingw64\bin\makensis.exe 存在即跳过）。
            $nsis64Dir = Join-Path $toolsPath 'NSIS64'
            $pkg64File = Join-Path $nsis64Dir 'mingw-w64-x86_64-nsis-3.13-2-any.pkg.tar.zst'
            $exe64File = Join-Path (Join-Path $nsis64Dir 'mingw64') 'bin\makensis.exe'
            if (-not ((Test-Path $exe64File) -and (Get-Item $exe64File).Length -gt 500KB)) {
              New-Item -ItemType Directory -Force -Path $nsis64Dir | Out-Null
              $pkg64Ok = $false
              foreach ($u in @(
                'https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/mingw64/mingw-w64-x86_64-nsis-3.13-2-any.pkg.tar.zst',
                'https://mirrors.ustc.edu.cn/msys2/mingw/mingw64/mingw-w64-x86_64-nsis-3.13-2-any.pkg.tar.zst',
                'https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-nsis-3.13-2-any.pkg.tar.zst'
              )) {
                Write-Output "[wocnb-ci] 下载 64 位 NSIS 编译器 (MSYS2): $u"
                curl.exe -sSL --retry 2 --connect-timeout 15 --max-time 300 -o $pkg64File $u
                if ($LASTEXITCODE -eq 0 -and (Test-Path $pkg64File) -and (Get-Item $pkg64File).Length -gt 500KB) { $pkg64Ok = $true; break }
                Write-Output '[wocnb-ci]   该源失败，换下一个'
              }
              if ($pkg64Ok) {
                # zstd 解包：优先 Windows 内置 tar.exe（libarchive，新版本支持
                # zstd 直解）；不支持时下载 zstd.exe 解成 .tar 再二次解包。
                Remove-Item (Join-Path $nsis64Dir 'mingw64') -Recurse -Force -ErrorAction SilentlyContinue
                tar.exe -xf $pkg64File -C $nsis64Dir 2>$null
                if (-not (Test-Path $exe64File)) {
                  Write-Output '[wocnb-ci] 内置 tar 不支持 zstd，改走 zstd.exe 兜底解包'
                  $zstdZip = Join-Path $nsis64Dir 'zstd-win64.zip'
                  foreach ($u in @(
                    'https://ghfast.top/https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-v1.5.6-win64.zip',
                    'https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-v1.5.6-win64.zip'
                  )) {
                    curl.exe -sSL --retry 2 --connect-timeout 15 -o $zstdZip $u
                    if ($LASTEXITCODE -eq 0 -and (Test-Path $zstdZip) -and (Get-Item $zstdZip).Length -gt 100KB) { break }
                  }
                  if (Test-Path $zstdZip) {
                    $zstdDir = Join-Path $nsis64Dir 'zstd'
                    Expand-Archive -Path $zstdZip -DestinationPath $zstdDir -Force
                    $zstdExe = Get-ChildItem $zstdDir -Filter 'zstd.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($zstdExe) {
                      $tarOut = Join-Path $nsis64Dir 'nsis-pkg.tar'
                      & $zstdExe.FullName -d -f -q -o $tarOut $pkg64File
                      if ($LASTEXITCODE -eq 0) {
                        tar.exe -xf $tarOut -C $nsis64Dir
                      }
                    }
                  }
                }
              }
              else {
                Write-Output '[wocnb-ci] 警告: 64 位 NSIS 编译器全部下载源失败，维持 32 位链路（打包走降级）'
              }
            }
            # 装配：64 位 makensis.exe 覆盖 NSIS 根目录的 32 位启动器桩。
            # 门槛「>500KB」防坏文件顶掉缓存里的可用产物（32 位真编译器也
            # 469KB，桩才 2560B —— 装配目标是桩的位置，坏文件不会误伤 Bin\）。
            #
            # rc.39~rc.42 实测的三处 msys2 适配（与官方 Windows zip 行为不同）：
            # 1) 资源目录：msys2 版按 Unix 布局 <exe 上级>\share\nsis 找
            #    Stubs/Include/Plugins（报错路径 %LOCALAPPDATA%\tauri\share\nsis
            #    证实），而非 exe 同目录 → 把包内 share/nsis 复制过去；
            # 2) 【target 只能是 amd64-unicode】msys2 的 mingw64 包是按
            #    TARGET_ARCH=amd64 编的（PKGBUILD 里写死），包内只有
            #    Stubs\*-amd64-unicode 与 Plugins\amd64-unicode，**完全没有
            #    x86 的 stub 与插件** —— 它根本产不出 32 位安装器。
            #    rc.40/rc.41 试图用 nsisconf.nsh 强行改回 x86-unicode，结果
            #    NSIS 按 x86 去搜插件必然落空，报
            #    "Plugin not found, cannot call nsis_tauri_utils::SemverCompare"
            #    （installer.nsi:237）。所以这里显式锁 amd64-unicode，与编译器
            #    的原生能力对齐：安装器变成 64 位，但本应用本就是 x64-only
            #    （target 只有 x86_64-pc-windows-msvc），无 32 位用户受影响。
            # 3) 插件架构：tauri cli 2.12.4 把 nsis_tauri_utils 的目标目录
            #    **硬编码**成 Plugins\x86-unicode\additional（源码
            #    NSIS_REQUIRED_FILES / target_folder），下发的也是 x86 变体，
            #    与 amd64 目标不匹配。amd64 变体只存在于官方 zip 里，故这里
            #    自行下载 v0.6.0 的 zip，取 amd64-unicode\nsis_tauri_utils.dll
            #    放进 <NSISDIR>\Plugins\amd64-unicode（NSIS 的默认插件搜索
            #    路径）。实测该 dll 导出 SemverCompare / RunAsUser，正是
            #    2.12.4 模板用到的两个函数，版本无兼容问题。
            #
            # nsisconf.nsh 的加载位置（源码 Source/makenssi.cpp:578~598）：
            #   · 主配置 = $NSISCONFDIR 环境变量；未设则「makensis.exe 所在
            #     目录」（msys2 编译时未定义 NSIS_CONFIG_CONST_DATA_PATH）
            #   · 家目录配置 = <home>\nsisconf.nsh（Windows 下即 %APPDATA%）
            # bundler 不传 /NOCONFIG，所以写到 exe 同目录必被 include。
            if ((Test-Path $exe64File) -and (Get-Item $exe64File).Length -gt 500KB) {
              Copy-Item $exe64File $rootExe -Force
              $share64Src = Join-Path (Join-Path $nsis64Dir 'mingw64') 'share\nsis'
              $share64Dst = Join-Path $toolsPath 'share\nsis'
              if ((Test-Path $share64Src) -and -not (Test-Path $share64Dst)) {
                New-Item -ItemType Directory -Force -Path (Split-Path $share64Dst) | Out-Null
                Copy-Item $share64Src $share64Dst -Recurse -Force
                Write-Output '[wocnb-ci] 已复制 msys2 NSIS 资源到 share\nsis'
              }

              # —— amd64 版 nsis_tauri_utils 插件（热更新语义依赖它）——
              # 落点是 NSISDIR 的「系统插件目录」，makensis 按 target 自动搜；
              # 已存在（持久缓存命中）就不再下载。
              $plugDst = Join-Path (Join-Path $share64Dst 'Plugins') 'amd64-unicode'
              New-Item -ItemType Directory -Force -Path $plugDst | Out-Null
              $plugFile = Join-Path $plugDst 'nsis_tauri_utils.dll'
              $plugOk = (Test-Path $plugFile) -and ((Get-Item $plugFile).Length -gt 10KB)
              if (-not $plugOk) {
                $plugZip = Join-Path $nsis64Dir 'nsis_tauri_utils-v0.6.0.zip'
                foreach ($u in @(
                  'https://ghfast.top/https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.6.0/nsis_tauri_utils.zip',
                  'https://gh-proxy.com/https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.6.0/nsis_tauri_utils.zip',
                  'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.6.0/nsis_tauri_utils.zip'
                )) {
                  Write-Output "[wocnb-ci] 下载 amd64 插件包: $u"
                  curl.exe -sSL --retry 2 --connect-timeout 15 -o $plugZip $u
                  if ($LASTEXITCODE -eq 0 -and (Test-Path $plugZip) -and (Get-Item $plugZip).Length -gt 30KB) { break }
                  Write-Output '[wocnb-ci]   该源失败，换下一个'
                }
                if ((Test-Path $plugZip) -and (Get-Item $plugZip).Length -gt 30KB) {
                  $plugTmp = Join-Path $nsis64Dir 'ntu'
                  Remove-Item $plugTmp -Recurse -Force -ErrorAction SilentlyContinue
                  Expand-Archive -Path $plugZip -DestinationPath $plugTmp -Force
                  # zip 内是三套架构目录，只取 amd64-unicode 这一份
                  $amd64Dll = Get-ChildItem $plugTmp -Filter 'nsis_tauri_utils.dll' -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.Directory.Name -eq 'amd64-unicode' } | Select-Object -First 1
                  if ($amd64Dll) {
                    Copy-Item $amd64Dll.FullName $plugFile -Force
                    $plugOk = $true
                  }
                }
              }
              if ($plugOk) {
                Write-Output ("[wocnb-ci] amd64-unicode 插件就绪: " + $plugFile + " (" + (Get-Item $plugFile).Length + " 字节)")
              } else {
                Write-Output '[wocnb-ci] 警告: amd64 版 nsis_tauri_utils 未就绪，NSIS 打包会因插件缺失失败'
              }

              # 锁目标架构（编译器默认已是 amd64-unicode，显式写一遍以防
              # msys2 后续改默认值；三处落盘任一命中即生效，内容幂等）
              $nsisConfBody = 'Target amd64-unicode'
              $confTargets = @(
                (Join-Path $nsisPath 'nsisconf.nsh'),
                (Join-Path $share64Dst 'nsisconf.nsh'),
                (Join-Path $env:APPDATA 'nsisconf.nsh')
              )
              foreach ($c in $confTargets) {
                $cDir = Split-Path $c
                if (-not (Test-Path $cDir)) { New-Item -ItemType Directory -Force -Path $cDir | Out-Null }
                Set-Content -Path $c -Value $nsisConfBody -Encoding ascii
              }
              Write-Output ("[wocnb-ci] 已写入 nsisconf.nsh（Target amd64-unicode）: " + ($confTargets -join ' | '))
              # /HDRINFO 打印编译器构建信息与 NSISDIR/NSISCONFDIR（排障用）
              $hdrOut = $null
              $prevEap2 = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try { $hdrOut = & $rootExe /HDRINFO 2>&1 } catch { $hdrOut = @() }
              $ErrorActionPreference = $prevEap2
              if ($hdrOut) { Write-Output ("[wocnb-ci] makensis /HDRINFO -> " + (($hdrOut | Select-Object -First 12) -join ' ')) }
              Write-Output ("[wocnb-ci] 64 位 makensis 装配完成（" + (Get-Item $exe64File).Length + " 字节，进程架构 x64，target 已锁 amd64-unicode）")
            }
            else {
              Write-Output '[wocnb-ci] 64 位 makensis 未就绪，makensis 试跑按 32 位链路验证'
            }
            # makensis.exe 是 32 位老程序，导入表里有 MSVCP60.dll（VC6 运行库）
            # 等 10 个系统 DLL；精简/容器化 Windows 镜像可能缺 32 位版本，
            # 表现为启动即 0xC0000135（STATUS_DLL_NOT_FOUND，rc.17/rc.18 实测）。
            # 这里逐个探测并把缺失项打进日志，便于判定到底是环境缺件还是别的问题。
            $nsisOk = $false
            if (Test-Path $rootExe) {
              # makensis 是 32 位进程，DLL 加载器只认 SysWOW64（不是 System32）；
              # rc.19 实测探测时先命中 System32 把「缺 32 位版本」掩盖了，这里
              # 明确区分两个目录分别报告
              $sysW = 'C:\Windows\SysWOW64'
              Write-Output ("[wocnb-ci] SysWOW64 存在: " + (Test-Path $sysW))
              $binDllDir = Join-Path $nsisPath 'Bin'
              $missing32 = @()
              foreach ($n in 'KERNEL32.dll', 'USER32.dll', 'GDI32.dll', 'SHELL32.dll', 'SHLWAPI.dll', 'OLEAUT32.dll', 'VERSION.dll', 'MSVCRT.dll', 'MSVCP60.dll', 'zlib1.dll') {
                $inNsis = (Test-Path (Join-Path $nsisPath $n)) -or (Test-Path (Join-Path $binDllDir $n))
                $inWow = Test-Path (Join-Path $sysW $n)
                $state = if ($inNsis) { 'NSIS目录' } elseif ($inWow) { 'SysWOW64' } else { '缺失(32位)' }
                Write-Output ("[wocnb-ci] 依赖 $n : $state")
                if ($state -eq '缺失(32位)') { $missing32 += $n }
              }
              # 能从 SysWOW64 补的（只补非系统核心 DLL，避免动系统文件）就先补
              foreach ($n in $missing32) {
                if ($n -eq 'MSVCP60.dll' -and (Test-Path (Join-Path $sysW $n))) {
                  Copy-Item (Join-Path $sysW $n) (Join-Path $nsisPath $n) -Force
                }
              }
              if ($missing32.Count -gt 0) {
                Write-Output ("[wocnb-ci] 32 位依赖缺失: " + ($missing32 -join ', '))
              }
              # 试跑：能出版本号说明 makensis 可用（排除缺 DLL / 被杀软隔离）。
              # ⚠️ 必须临时放宽 $ErrorActionPreference（rc.39 实测）：native 命令
              # 向 stderr 写内容时 PS 5.1 会抛 NativeCommandError，在 'Stop' 下是
              # **终止性错误** —— 探测失败会直接挂掉整个 stage，而不是走三级
              # 降级（表现：Windows 流水线 error 而总状态仍 success）。
              $verOut = $null
              $prevEap = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try { $verOut = & $rootExe /VERSION 2>&1 }
              catch { $verOut = @("$($_.Exception.Message)") }
              $verExit = $LASTEXITCODE
              $ErrorActionPreference = $prevEap
              Write-Output ("[wocnb-ci] makensis /VERSION -> exit=$verExit out=" + ($verOut -join ' '))
              if ($verExit -eq 0) { $nsisOk = $true }
            } else {
              Write-Output '[wocnb-ci] 警告: 根目录缺少 makensis.exe（可能被杀毒软件隔离）'
            }
            # target 用 junction 指向宿主机缓存目录，避免每次冷编译
            $cache = Join-Path $env:USERPROFILE '.cnb-cache\win-target'
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            if (-not (Test-Path 'src-tauri\target')) {
              New-Item -ItemType Junction -Path 'src-tauri\target' -Target $cache | Out-Null
            }
            # rustup 可选：x64 是编译机本机架构，rustc 默认 target 就是它；
            # 装了 rustup 就顺手注册 target，没装（如 MSI/scoop 直装 rustc）也能构建
            if (Get-Command rustup -ErrorAction SilentlyContinue) {
              rustup target add x86_64-pc-windows-msvc
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            # 打包器选择（三级降级）：
            #   1) makensis 可用 → nsis（体积小、updater 首选）
            #   2) 正式版（版本号无预发布后缀）→ msi（WiX 实现，不依赖 VC6 运行库）
            #   3) 预发布版且 makensis 不可用 → --no-bundle 只出裸 exe：
            #      WiX 拒绝非纯数字的预发布标识（0.1.0-rc.N 里的 rc 会被拒），
            #      所以 rc 阶段先用绿色链路 + 可执行产物保证链路验证完整。
            #
            # ⚠️ nsis/msi 分支必须带 --config src-tauri/tauri.updater.conf.json：
            # 该文件开 createUpdaterArtifacts=true（主配置里刻意关着，避免本地
            # 无私钥构建报错）。不带它就不会生成 .sig 签名文件 —— Windows
            # 永远进不了 updater 清单（2026-11-19 排查时发现的隐藏前提，
            # 与 macOS build-arm64 的口径对齐）。
            # —— 热更新签名私钥校验（nsis/msi 分支都开 createUpdaterArtifacts，
            # 无私钥 bundler 必失败）——
            # 来源：本流水线 imports（CNB 密钥仓库 wocnb.yaml）注入的环境变量。
            # 这里提前判定并给出明确指引，避免 bundler 抛出难以定位的错误；
            # 与 macOS 线不同，Windows 构建机没有 ~/.tauri 私钥文件回退（容器
            # 化 SYSTEM 账户，家目录不可持久），所以只认 imports 这一层。
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              Write-Output '错误: 缺少热更新签名私钥 TAURI_SIGNING_PRIVATE_KEY（应在密钥仓库 jackytse/secrets 的 wocnb.yaml 中配置）'
              exit 1
            }
            Write-Output ("[wocnb-ci] 签名私钥已注入（长度 " + $env:TAURI_SIGNING_PRIVATE_KEY.Length + " 字符）")
            # 无密码私钥也要显式置空：部分 bundler 版本会因变量缺失尝试交互式
            # 询问密码，CI 非交互环境会卡住
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = '' }
            $appVer = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
            $isPreRelease = ("$appVer" -match '-')
            if ($nsisOk) {
              Write-Output '[wocnb-ci] 使用 NSIS 打包（含热更新产物签名）'
              pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.updater.conf.json
            } elseif (-not $isPreRelease) {
              Write-Output '[wocnb-ci] 警告: makensis 不可用，正式版改用 MSI(WiX) 打包'
              pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles msi --config src-tauri/tauri.updater.conf.json
            } else {
              Write-Output '[wocnb-ci] 警告: makensis 不可用且当前为预发布版（WiX 不支持非数字预发布标识），只产出裸 exe'
              pnpm exec tauri build --target x86_64-pc-windows-msvc --no-bundle
            }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # 产物架构自检（rc.42 新增）：target 是否真落到 amd64-unicode，
            # 只看日志无法确认，直接读 PE 头 machine 字段（0x8664=x64 /
            # 0x14c=x86）。仅打印不失败 —— 真出错时上一步 makensis 已报错退出。
            if ($nsisOk) {
              $setupExe = Get-ChildItem 'src-tauri\target' -Recurse -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($setupExe) {
                $fs = [System.IO.File]::OpenRead($setupExe.FullName)
                $br = New-Object System.IO.BinaryReader($fs)
                $fs.Position = 0x3C
                $peOff = $br.ReadInt32()
                $fs.Position = $peOff + 4
                $machine = $br.ReadUInt16()
                $br.Close()
                $fs.Close()
                $archName = switch ($machine) { 0x8664 { 'x64' } 0x14c { 'x86(32位)' } default { ('0x{0:x}' -f $machine) } }
                Write-Output ("[wocnb-ci] setup.exe 架构: $archName -> " + $setupExe.Name)
                if ($machine -ne 0x8664) { Write-Output '[wocnb-ci] 警告: setup.exe 非 x64，说明 Target 指令未生效' }
              }
              else {
                Write-Output '[wocnb-ci] 警告: 未找到 *-setup.exe 产物'
              }
            }
            powershell -NoProfile -File scripts/ci/collect-windows.ps1 -Triple x86_64-pc-windows-msvc -Arch x64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
    #
        # 【架构裁剪 2026-11-10】Windows arm64 节点未接入（x64 节点交叉编译 arm64
        # 还需 VS 2022 的「MSVC v143 C++ ARM64 生成工具」），build-arm64 已移除。
        # 后续接入 arm64 节点（标签按节点实际填，如 win + arm64）后，从 git 历史恢复该 stage：
        #   pnpm exec tauri build --target aarch64-pc-windows-msvc --bundles nsis
        #   powershell -NoProfile -File scripts/ci/collect-windows.ps1 -Triple aarch64-pc-windows-msvc -Arch arm64
    #
        - name: checksums
          script: |
            $ErrorActionPreference = 'Stop'
            Push-Location release
            # 同时覆盖 nsis（.exe）与降级 msi（.msi）两种产物
            Get-ChildItem -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object {
              $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            } | Set-Content -Encoding ascii SHA256SUMS-windows.txt
            Get-Content SHA256SUMS-windows.txt
            Pop-Location
    #
        - name: upload
          script: |
            $ErrorActionPreference = 'Stop'
            powershell -NoProfile -File scripts/ci/release-upload.ps1 -Dir ./release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
    #
        # 热更新清单合并（Windows 侧条目）：把 windows-x64（NSIS setup.exe +
        # .sig）写进 updater-manifest Release 的 latest.json（与 macOS 的
        # publish-manifest 对称合并，机制见 scripts/ci/publish-manifest-windows.ps1
        # 头注释）。签名缺失（三级降级到裸 exe）时脚本正常退出不发布。
        - name: publish-manifest
          script: |
            $ErrorActionPreference = 'Stop'
            powershell -NoProfile -File scripts/ci/publish-manifest-windows.ps1 -Dir ./release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
